<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Metronome</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfeff',
                            100: '#cffaff',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            900: '#164e63',
                        },
                        accent: {
                            500: '#f43f5e',
                            600: '#e11d48'
                        },
                        click2: {
                            500: '#3b82f6',
                            600: '#2563eb'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Custom Range Input Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 10px;
            cursor: pointer;
            background: #334155;
            border-radius: 9999px;
            border: 0;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            box-shadow: 0 4px 10px rgba(6, 182, 212, 0.4);
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
            background: #22d3ee;
        }

        /* Glassmorphic elements */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Scrollbar styling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-800/60 glass-panel sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <i class="fa-solid font-bold text-white text-lg fa-sliders"></i>
            </div>
            <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">PulseBPM</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="wakeLockBtn" class="p-2.5 rounded-xl bg-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-700 transition active:scale-95" title="Keep Screen Awake">
                <i id="wakeLockIcon" class="fa-solid fa-lightbulb text-base"></i>
            </button>
            <button id="muteBtn" class="p-2.5 rounded-xl bg-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-700 transition active:scale-95" title="Mute Sound">
                <i id="muteIcon" class="fa-solid fa-volume-high text-base"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto px-4 py-4 flex-1 flex flex-col justify-between items-center gap-4">

        <!-- Visual Flash & Beat Counter -->
        <div class="w-full flex flex-col items-center justify-center gap-3 mt-1">
            <div id="visualPulse" class="w-24 h-24 rounded-full border-4 border-slate-800 bg-slate-900/50 flex items-center justify-center transition-all duration-75 relative shadow-inner">
                <div id="pulseInner" class="w-16 h-16 rounded-full bg-slate-800 transition-all duration-75"></div>
                <div id="beatCounter" class="absolute text-2xl font-black text-slate-400">1</div>
            </div>
        </div>

        <!-- Interactive Beat Grid Card -->
        <div class="w-full glass-panel rounded-2xl p-3.5">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <i class="fa-solid fa-grip text-brand-400"></i> Beat Pattern Grid
                </span>
                <span id="speedBadge" class="hidden text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40">
                    2x SPEED (/8)
                </span>
            </div>
            <!-- Grid container -->
            <div id="beatGridContainer" class="grid grid-cols-4 sm:grid-cols-8 gap-2 w-full">
                <!-- Dynamic beat tiles rendered here -->
            </div>
            <div class="flex justify-between items-center mt-2 text-[10px] text-slate-500 font-medium px-1">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-accent-500"></span> Click 1</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-click2-500"></span> Click 2</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-700"></span> Off</span>
            </div>
        </div>

        <!-- Tempo Display & Controls -->
        <div class="w-full glass-panel rounded-3xl p-5 flex flex-col items-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div id="tempoMarking" class="text-brand-400 font-semibold tracking-widest uppercase text-xs mb-1">
                MODERATO
            </div>

            <div class="flex items-baseline justify-center gap-1 my-1">
                <span id="bpmDisplay" class="text-7xl font-extrabold tracking-tighter text-white drop-shadow-md">120</span>
                <span class="text-slate-400 font-medium text-sm tracking-wider uppercase">BPM</span>
            </div>

            <!-- Fine Adjustment Buttons -->
            <div class="flex items-center justify-center gap-2 my-3 w-full">
                <button onclick="changeBPM(-5)" class="flex-1 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold text-sm transition border border-slate-700/50">-5</button>
                <button onclick="changeBPM(-1)" class="flex-1 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold text-sm transition border border-slate-700/50">-1</button>
                <button onclick="changeBPM(1)" class="flex-1 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold text-sm transition border border-slate-700/50">+1</button>
                <button onclick="changeBPM(5)" class="flex-1 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-300 font-semibold text-sm transition border border-slate-700/50">+5</button>
            </div>

            <!-- BPM Slider -->
            <div class="w-full px-2 mt-1">
                <input type="range" id="bpmSlider" min="30" max="300" value="120" step="1">
                <div class="flex justify-between text-xs text-slate-500 mt-2 font-medium">
                    <span>30</span>
                    <span>120</span>
                    <span>210</span>
                    <span>300</span>
                </div>
            </div>
        </div>

        <!-- Start & Tap Tempo Controls -->
        <div class="w-full grid grid-cols-3 gap-3 items-center">
            <button id="tapBtn" class="col-span-1 py-4 rounded-2xl bg-slate-800/90 hover:bg-slate-700/90 active:bg-slate-700 active:scale-95 text-slate-200 font-bold text-sm tracking-wide shadow-lg border border-slate-700/60 flex flex-col items-center justify-center gap-1 transition">
                <i class="fa-solid fa-hand-pointer text-brand-400 text-lg"></i>
                <span>TAP TEMPO</span>
            </button>

            <button id="playBtn" class="col-span-2 py-4 rounded-2xl bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 active:scale-95 text-white font-extrabold text-xl tracking-wider shadow-lg shadow-brand-500/25 flex items-center justify-center gap-3 transition">
                <i id="playIcon" class="fa-solid fa-play text-2xl"></i>
                <span id="playText">START</span>
            </button>
        </div>

        <!-- Meter Controls -->
        <div class="w-full space-y-3">
            <div class="glass-panel rounded-2xl p-3.5">
                <div class="flex items-center justify-between mb-2">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-music text-brand-400"></i> Time Signature
                    </div>
                </div>

                <!-- Quick Presets -->
                <div class="grid grid-cols-4 sm:grid-cols-8 gap-1.5 mb-3" id="timeSigContainer">
                    <button data-num="2" data-den="4" class="sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">2/4</button>
                    <button data-num="3" data-den="4" class="sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">3/4</button>
                    <button data-num="4" data-den="4" class="sig-btn py-1.5 rounded-lg bg-brand-500/20 border-2 border-brand-500 text-xs font-bold text-brand-400 hover:bg-slate-700 transition">4/4</button>
                    <button data-num="6" data-den="8" class="sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">6/8</button>
                    <button data-num="7" data-den="4" class="sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">7/4</button>
                    <button data-num="7" data-den="8" class="sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">7/8</button>
                    <button data-num="9" data-den="8" class="sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">9/8</button>
                    <button data-num="11" data-den="8" class="sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">11/8</button>
                </div>

                <!-- Custom Meter Controls -->
                <div class="flex items-center justify-between gap-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                    <span class="text-xs font-medium text-slate-400 pl-1">Custom Meter:</span>
                    <div class="flex items-center gap-2">
                        <!-- Numerator Adjustment -->
                        <div class="flex items-center bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
                            <button onclick="adjustCustomBeats(-1)" class="px-2.5 py-1 text-slate-300 hover:bg-slate-700 text-xs font-bold active:scale-95 transition">-</button>
                            <span id="customBeatsVal" class="px-2 text-xs font-extrabold text-brand-400 min-w-[20px] text-center">4</span>
                            <button onclick="adjustCustomBeats(1)" class="px-2.5 py-1 text-slate-300 hover:bg-slate-700 text-xs font-bold active:scale-95 transition">+</button>
                        </div>
                        <span class="text-slate-500 font-bold text-sm">/</span>
                        <!-- Denominator Selection -->
                        <div class="flex rounded-lg bg-slate-800 p-0.5 border border-slate-700">
                            <button id="den4Btn" onclick="setDenominator(4)" class="px-2.5 py-1 rounded-md text-xs font-bold bg-brand-500 text-slate-950 transition">4</button>
                            <button id="den8Btn" onclick="setDenominator(8)" class="px-2.5 py-1 rounded-md text-xs font-bold text-slate-400 hover:text-slate-200 transition">8</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pitch Settings -->
            <div class="glass-panel rounded-2xl p-3.5">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-wave-square text-brand-400"></i> Tone Timbre
                </div>
                <select id="pitchSelect" class="w-full py-2 px-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-bold focus:outline-none focus:border-brand-500">
                    <option value="medium" selected>Standard Tone (High / Low)</option>
                    <option value="high">High Pitch Tone</option>
                    <option value="woodblock">Woodblock Tone</option>
                    <option value="digital">Digital Beep</option>
                </select>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-3 text-slate-500 text-xs border-t border-slate-800/40 mt-auto">
        Sample-Accurate Web Audio Engine • PulseBPM
    </footer>

    <!-- Audio & Interaction Logic -->
    <script>
        // Engine State
        let audioContext = null;
        let isPlaying = false;
        let bpm = 120;
        let beatsPerMeasure = 4;
        let beatDenominator = 4; // 4 or 8
        let currentBeat = 0;
        
        // Dynamic Beat States: Array of size beatsPerMeasure containing 1 (Click 1), 2 (Click 2), or 0 (Off)
        let beatStates = [1, 2, 2, 2];

        // Scheduler timing
        const lookahead = 25.0; // ms
        const scheduleAheadTime = 0.1; // seconds
        let nextNoteTime = 0.0;
        let timerID = null;

        // UI Options
        let isMuted = false;
        let selectedPitch = 'medium';
        let wakeLock = null;

        // Tap Tempo
        let tapTimes = [];
        const MAX_TAP_DIFF = 2500;

        // DOM Elements
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const bpmSlider = document.getElementById('bpmSlider');
        const tempoMarking = document.getElementById('tempoMarking');
        const visualPulse = document.getElementById('visualPulse');
        const pulseInner = document.getElementById('pulseInner');
        const beatCounter = document.getElementById('beatCounter');
        const beatGridContainer = document.getElementById('beatGridContainer');
        const speedBadge = document.getElementById('speedBadge');
        const muteBtn = document.getElementById('muteBtn');
        const muteIcon = document.getElementById('muteIcon');
        const tapBtn = document.getElementById('tapBtn');
        const pitchSelect = document.getElementById('pitchSelect');
        const wakeLockBtn = document.getElementById('wakeLockBtn');
        const wakeLockIcon = document.getElementById('wakeLockIcon');
        const customBeatsVal = document.getElementById('customBeatsVal');
        const den4Btn = document.getElementById('den4Btn');
        const den8Btn = document.getElementById('den8Btn');

        // Tempo terms
        const TEMPO_MARKINGS = [
            { max: 45, name: 'Grave' },
            { max: 60, name: 'Largo' },
            { max: 76, name: 'Adagio' },
            { max: 108, name: 'Andante' },
            { max: 120, name: 'Moderato' },
            { max: 156, name: 'Allegro' },
            { max: 200, name: 'Presto' },
            { max: 300, name: 'Prestissimo' }
        ];

        // Pitch definitions
        const PITCH_CONFIGS = {
            high: { click1: 1400, click2: 900, type: 'sine' },
            medium: { click1: 880, click2: 440, type: 'sine' },
            woodblock: { click1: 650, click2: 380, type: 'triangle' },
            digital: { click1: 1760, click2: 880, type: 'square' }
        };

        function initAudioContext() {
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderBeatGrid();
            updateTempoMarking();
            setupTimeSignatureButtons();

            bpmSlider.addEventListener('input', (e) => {
                setBPM(parseInt(e.target.value));
            });

            pitchSelect.addEventListener('change', (e) => {
                selectedPitch = e.target.value;
            });

            playBtn.addEventListener('click', togglePlay);
            tapBtn.addEventListener('click', handleTapTempo);
            muteBtn.addEventListener('click', toggleMute);
            wakeLockBtn.addEventListener('click', toggleWakeLock);
        });

        function togglePlay() {
            initAudioContext();
            isPlaying = !isPlaying;

            if (isPlaying) {
                currentBeat = 0;
                nextNoteTime = audioContext.currentTime + 0.05;
                scheduler();
                
                playBtn.classList.remove('from-brand-500', 'to-brand-600');
                playBtn.classList.add('from-accent-500', 'to-accent-600');
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                playText.innerText = 'STOP';
                
                requestWakeLock();
            } else {
                clearTimeout(timerID);
                
                playBtn.classList.remove('from-accent-500', 'to-accent-600');
                playBtn.classList.add('from-brand-500', 'to-brand-600');
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                playText.innerText = 'START';
                
                resetVisuals();
            }
        }

        function scheduler() {
            while (nextNoteTime < audioContext.currentTime + scheduleAheadTime) {
                scheduleNote(currentBeat, nextNoteTime);
                nextNote();
            }
            timerID = setTimeout(scheduler, lookahead);
        }

        function nextNote() {
            // Speed Doubling logic: If denominator is /8, BPM is effectively doubled
            const effectiveBPM = beatDenominator === 8 ? bpm * 2 : bpm;
            const secondsPerBeat = 60.0 / effectiveBPM;

            nextNoteTime += secondsPerBeat;
            currentBeat = (currentBeat + 1) % beatsPerMeasure;
        }

        function scheduleNote(beatIndex, time) {
            const beatState = beatStates[beatIndex];

            // 0 = Off (Muted beat)
            if (!isMuted && beatState !== 0) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                const soundConfig = PITCH_CONFIGS[selectedPitch] || PITCH_CONFIGS.medium;
                const freq = beatState === 1 ? soundConfig.click1 : soundConfig.click2;
                const gainPeak = beatState === 1 ? 0.9 : 0.6;
                const duration = beatState === 1 ? 0.08 : 0.05;

                osc.type = soundConfig.type;
                osc.frequency.setValueAtTime(freq, time);

                gain.gain.setValueAtTime(gainPeak, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.start(time);
                osc.stop(time + duration);
            }

            const timeUntilNote = Math.max(0, (time - audioContext.currentTime) * 1000);
            setTimeout(() => {
                triggerVisualBeat(beatIndex, beatState);
            }, timeUntilNote);
        }

        function triggerVisualBeat(beatIndex, beatState) {
            if (!isPlaying) return;

            beatCounter.innerText = beatIndex + 1;

            if (beatState === 1) {
                visualPulse.className = 'w-24 h-24 rounded-full border-4 border-accent-500 bg-accent-500/20 flex items-center justify-center transition-all duration-75 relative shadow-lg shadow-accent-500/30 scale-105';
                pulseInner.className = 'w-16 h-16 rounded-full bg-accent-500 transition-all duration-75';
                beatCounter.className = 'absolute text-2xl font-black text-white';
            } else if (beatState === 2) {
                visualPulse.className = 'w-24 h-24 rounded-full border-4 border-click2-500 bg-click2-500/20 flex items-center justify-center transition-all duration-75 relative shadow-lg shadow-click2-500/20 scale-105';
                pulseInner.className = 'w-16 h-16 rounded-full bg-click2-500 transition-all duration-75';
                beatCounter.className = 'absolute text-2xl font-black text-white';
            } else {
                // Off beat
                visualPulse.className = 'w-24 h-24 rounded-full border-4 border-slate-700 bg-slate-900/50 flex items-center justify-center transition-all duration-75 relative shadow-inner';
                pulseInner.className = 'w-16 h-16 rounded-full bg-slate-800 transition-all duration-75';
                beatCounter.className = 'absolute text-2xl font-black text-slate-500';
            }

            // Highlight Active Tile in Grid
            const tiles = beatGridContainer.querySelectorAll('.beat-tile');
            tiles.forEach((tile, idx) => {
                if (idx === beatIndex) {
                    tile.classList.add('ring-2', 'ring-white', 'scale-105', 'z-10');
                } else {
                    tile.classList.remove('ring-2', 'ring-white', 'scale-105', 'z-10');
                }
            });

            setTimeout(() => {
                if (isPlaying) {
                    visualPulse.className = 'w-24 h-24 rounded-full border-4 border-slate-800 bg-slate-900/50 flex items-center justify-center transition-all duration-75 relative shadow-inner';
                    pulseInner.className = 'w-16 h-16 rounded-full bg-slate-800 transition-all duration-75';
                    beatCounter.className = 'absolute text-2xl font-black text-slate-400';
                }
            }, 100);
        }

        function resetVisuals() {
            visualPulse.className = 'w-24 h-24 rounded-full border-4 border-slate-800 bg-slate-900/50 flex items-center justify-center transition-all duration-75 relative shadow-inner';
            pulseInner.className = 'w-16 h-16 rounded-full bg-slate-800 transition-all duration-75';
            beatCounter.className = 'absolute text-2xl font-black text-slate-400';
            beatCounter.innerText = '1';

            const tiles = beatGridContainer.querySelectorAll('.beat-tile');
            tiles.forEach(tile => {
                tile.classList.remove('ring-2', 'ring-white', 'scale-105', 'z-10');
            });
        }

        // Render interactive Beat Accent Grid
        function renderBeatGrid() {
            beatGridContainer.innerHTML = '';
            
            // Re-align array size with beatsPerMeasure
            while (beatStates.length < beatsPerMeasure) {
                beatStates.push(2); // default secondary click
            }
            if (beatStates.length > beatsPerMeasure) {
                beatStates = beatStates.slice(0, beatsPerMeasure);
            }

            beatStates.forEach((state, idx) => {
                const tile = document.createElement('button');
                tile.className = `beat-tile aspect-square rounded-xl flex flex-col items-center justify-center font-bold text-xs transition-all border ${getTileStyle(state)}`;
                tile.innerHTML = `<span>${idx + 1}</span><span class="text-[9px] opacity-75">${getStateLabel(state)}</span>`;
                
                tile.addEventListener('click', () => {
                    // Cycle: 1 (Click 1) -> 2 (Click 2) -> 0 (Off) -> 1
                    beatStates[idx] = (beatStates[idx] + 1) % 3;
                    if (beatStates[idx] === 3) beatStates[idx] = 0; // Guard
                    renderBeatGrid();
                });

                beatGridContainer.appendChild(tile);
            });
        }

        function getTileStyle(state) {
            if (state === 1) return 'bg-accent-500 border-accent-600 text-white shadow-md shadow-accent-500/20';
            if (state === 2) return 'bg-click2-500 border-click2-600 text-white shadow-md shadow-click2-500/20';
            return 'bg-slate-800/80 border-slate-700 text-slate-500';
        }

        function getStateLabel(state) {
            if (state === 1) return 'C1';
            if (state === 2) return 'C2';
            return 'OFF';
        }

        function changeBPM(amount) {
            setBPM(bpm + amount);
        }

        function setBPM(val) {
            bpm = Math.max(30, Math.min(300, val));
            bpmDisplay.innerText = bpm;
            bpmSlider.value = bpm;
            updateTempoMarking();
        }

        function updateTempoMarking() {
            const marking = TEMPO_MARKINGS.find(m => bpm <= m.max) || TEMPO_MARKINGS[TEMPO_MARKINGS.length - 1];
            tempoMarking.innerText = marking.name;
        }

        function handleTapTempo() {
            const now = performance.now();
            if (tapTimes.length > 0 && (now - tapTimes[tapTimes.length - 1]) > MAX_TAP_DIFF) {
                tapTimes = [];
            }
            tapTimes.push(now);

            if (tapTimes.length > 1) {
                const intervals = [];
                for (let i = 1; i < tapTimes.length; i++) {
                    intervals.push(tapTimes[i] - tapTimes[i - 1]);
                }
                const averageInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                const calculatedBPM = Math.round(60000 / averageInterval);
                setBPM(calculatedBPM);
            }
        }

        function setTimeSignature(num, den) {
            beatsPerMeasure = Math.max(1, Math.min(16, num));
            beatDenominator = den === 8 ? 8 : 4;
            currentBeat = 0;

            // Toggle Speed Badge
            if (beatDenominator === 8) {
                speedBadge.classList.remove('hidden');
                den8Btn.className = 'px-2.5 py-1 rounded-md text-xs font-bold bg-brand-500 text-slate-950 transition';
                den4Btn.className = 'px-2.5 py-1 rounded-md text-xs font-bold text-slate-400 hover:text-slate-200 transition';
            } else {
                speedBadge.classList.add('hidden');
                den4Btn.className = 'px-2.5 py-1 rounded-md text-xs font-bold bg-brand-500 text-slate-950 transition';
                den8Btn.className = 'px-2.5 py-1 rounded-md text-xs font-bold text-slate-400 hover:text-slate-200 transition';
            }

            customBeatsVal.innerText = beatsPerMeasure;

            const buttons = document.querySelectorAll('.sig-btn');
            buttons.forEach(btn => {
                const bNum = parseInt(btn.getAttribute('data-num'));
                const bDen = parseInt(btn.getAttribute('data-den'));
                if (bNum === beatsPerMeasure && bDen === beatDenominator) {
                    btn.className = 'sig-btn py-1.5 rounded-lg bg-brand-500/20 border-2 border-brand-500 text-xs font-bold text-brand-400 hover:bg-slate-700 transition';
                } else {
                    btn.className = 'sig-btn py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-700 transition';
                }
            });

            renderBeatGrid();
        }

        function adjustCustomBeats(delta) {
            setTimeSignature(beatsPerMeasure + delta, beatDenominator);
        }

        function setDenominator(den) {
            setTimeSignature(beatsPerMeasure, den);
        }

        function setupTimeSignatureButtons() {
            const buttons = document.querySelectorAll('.sig-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const num = parseInt(e.currentTarget.getAttribute('data-num'));
                    const den = parseInt(e.currentTarget.getAttribute('data-den'));
                    setTimeSignature(num, den);
                });
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            muteIcon.className = isMuted ? 'fa-solid fa-volume-xmark text-accent-500' : 'fa-solid fa-volume-high text-slate-400';
        }

        async function toggleWakeLock() {
            if (wakeLock !== null) {
                await wakeLock.release();
                wakeLock = null;
                wakeLockIcon.className = 'fa-solid fa-lightbulb text-slate-400';
            } else {
                await requestWakeLock();
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockIcon.className = 'fa-solid fa-lightbulb text-amber-400 drop-shadow-md';
                    wakeLock.addEventListener('release', () => {
                        wakeLockIcon.className = 'fa-solid fa-lightbulb text-slate-400';
                        wakeLock = null;
                    });
                }
            } catch (err) {
                console.warn('Wake Lock error:', err);
            }
        }
    </script>
</body>
</html>
